name: Java CI

on:
  push:
    branches: [ "master", "KhanbanTasks" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Compile Java
      run: javac -d build src/loginapp/*.java
      
    - name: Download JUnit
      run: |
        curl -L -o junit-platform-console-standalone.jar https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.9.2/junit-platform-console-standalone-1.9.2.jar
        
    - name: Run Tests
      run: java -jar junit-platform-console-standalone.jar -cp build --scan-class-path
